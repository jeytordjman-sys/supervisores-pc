[supabase]
# Version Supabase (import_supabase.py) — recommandée.
# URL du projet : Supabase → Project Settings → API → Project URL
url = https://xxxxxxxxxxxxxxxxxxxx.supabase.co
# Clé service_role (secrète ! ne jamais la mettre dans l'app ni dans GitHub) : Project Settings → API → service_role
service_role_key = COLLER_LA_CLE_SERVICE_ROLE_ICI
dossier_csv = \\serveur\partage\sage_export
fichier_stock = stock.csv
fichier_expedicoes = expedicoes.csv
fichier_kpis = kpis.csv

[app]
# Ancienne version Floot (import_sage.py). Adresse de l'app publiée (sans / final).
url = https://VOTRE-APP.floot.app

# Clé d'import : app -> Sede -> Configuração -> Parâmetros -> « Chave do import automático ».
import_key = COLLER_LA_CLE_ICI

# Dossier partagé où l'informatique dépose les CSV chaque nuit.
dossier_csv = \\serveur\partage\sage_export

# Noms des fichiers (modifiables). kpis.csv est optionnel.
fichier_stock = stock.csv
fichier_expedicoes = expedicoes.csv
fichier_kpis = kpis.csv
