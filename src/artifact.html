function summary(s){
  const t=today();
  const vs = S.visits.filter(v=>v.store===s.id).sort((a,b)=>b.at.localeCompare(a.at));
  const last = vs[0]? new Date(vs[0].at) : null;
  const cad = effCad(s);
  const next = last? dayOf(addDays(last, cadDays(cad))) : t;
  const daysUntil = daysBetween(t,next);
  const status = !last? "never" : daysUntil<0? "late" : daysUntil<=S.settings.dueSoon? "soon" : "ok";
  const statusText = status==="never"?"Nunca visitada": status==="late"?`Atrasada ${-daysUntil} d`: status==="soon"?(daysUntil===0?"Visitar hoje":`Visitar até ${fmtDay(next)}`):`Em dia · ${fmtDay(next)}`;
  const acts = S.actions.filter(a=>a.store===s.id && a.status!=="done");
  const late = acts.filter(a=>dayOf(a.due)<t).length;
  const st = S.stock.filter(x=>x.site===s.code);
  const ruptures = st.filter(x=>x.qty<=0).length;
  const dormant = st.filter(x=>x.qty>0 && (!x.last || daysBetween(x.last,t)>S.settings.dormant)).length;
  const sh = S.shipments.filter(x=>x.site===s.code);
  const lastShip = sh.length? sh.map(x=>x.date).sort().slice(-1)[0] : null;
  const inTransit = sh.filter(x=>x.status==="in_transit").length;
  const disc = sh.filter(x=>x.status==="discrepancy"||(x.status==="received"&&x.sent!==x.recv)).length;
  const alerts=[];
  if(ruptures) alerts.push(`${ruptures} rutura(s) em referências chave`);
  if(dormant) alerts.push(`${dormant} referência(s) com stock dormente`);
  if(disc) alerts.push(`${disc} envio(s) com diferença de receção`);
  if(late) alerts.push(`${late} ação(ões) em atraso`);
  if(lastShip && daysBetween(lastShip,t)>S.settings.noShip) alerts.push(`Sem envio do armazém há ${daysBetween(lastShip,t)} dias`);
  const noVisitDays = last? daysBetween(last,t) : null;
  const noVisit = !last || noVisitDays>S.settings.maxNoVisit;
  if(noVisit) alerts.unshift(last? `Sem visita há ${noVisitDays} dias (limite ${S.settings.maxNoVisit})` : "Nunca visitada");
  const visits30 = vs.filter(v=>daysBetween(v.at,t)<=30).length;
  return {...s, cadE:cad, last, next, daysUntil, status, statusText, open:acts.length, late, ruptures, dormant, lastShip, inTransit, disc, alerts, visits30, noVisit, noVisitDays, lastReason:vs[0]?.reason||"", supName:S.users.find(u=>u.id===s.sup)?.name||"—"};
}

  return `<svg viewBox="${vb.map(n=>n.toFixed(1)).join(" ")}" class="map" role="img" aria-label="Mapa das lojas">${grid}<polygon points="${outline}" fill="var(--soft)" stroke="var(--muted)" stroke-width="${1.2*f}" stroke-linejoin="round"/>${cities}${path}${marks}${labels}</svg>`;
}

const root = $("#root");
function render(){
  save();
  if(!UI.user){ root.innerHTML = Login(); bind(); return; }
  if(UI.screen==="sede" && !isAdmin()) UI.screen="lojas";
  const tabs = [["lojas","Lojas",I.store],["agenda","Agenda",I.cal],["nova","Visita",I.plus],["acoes","Ações",I.check]].concat(isAdmin()?[["sede","Sede",I.hq]]:[]);
  const active = UI.screen==="loja"?"lojas":UI.screen==="plan"?"agenda":UI.screen;
  const u=user();
  root.innerHTML = `<div class="app">
    <header class="top"><div class="brand"><span class="mark">P&amp;C</span>Supervisores</div>
      <div class="who"><span>${esc(u.name)}</span><button class="link" data-act="logout" aria-label="Sair">${I.out}</button></div></header>
    <nav class="tabs" aria-label="Navegação">${tabs.map(([k,l,ic])=>`<button data-go="${k}" class="${active===k?"on":""}">${ic}<span>${l}</span></button>`).join("")}</nav>
    <main>${({lojas:Lojas,loja:Loja,nova:Nova,acoes:Acoes,sede:Sede,agenda:Agenda,plan:Plan})[UI.screen]()}</main></div>`;

}
function go(screen, storeId){ UI.screen=screen; if(storeId!==undefined) UI.storeId=storeId; if(screen!=="nova") UI.draft=null; window.scrollTo(0,0); render(); }

function Login(){
  return `<div class="login"><div class="card">
    <div><span class="mark">P&amp;C</span><h1 style="margin-top:12px">Supervisores</h1><p class="muted">Visitas às lojas · Perfumes &amp; Companhia</p></div>
    <p class="muted" style="text-align:left">Protótipo para teste: escolha com quem entrar. Os dados são de exemplo e ficam guardados só neste telemóvel/browser.</p>
    <div class="roles">${S.users.map(u=>`<button class="role" data-login="${u.id}"><span>${esc(u.name)}<br><small>${u.role==="admin"?"Sede · painel, configuração, import":"Supervisor · "+S.stores.filter(s=>s.sup===u.id).length+" lojas"}</small></span><span>›</span></button>`).join("")}</div>
    <button class="btn ghost sm" data-act="reset">Repor dados de exemplo</button>
  </div></div>`;
}

function statusChip(s){ return `<span class="status s-${s.status}">${esc(s.statusText)}</span>`; }

function Lojas(){
  let list = myStores();
  if(isAdmin() && UI.supFilter!=="all") list = list.filter(s=>String(s.sup)===UI.supFilter);
  const counts = {all:list.length, late:list.filter(s=>s.status==="late"||s.status==="never").length, soon:list.filter(s=>s.status==="soon").length, alerts:list.filter(s=>s.alerts.length).length};
  if(UI.filter==="late") list=list.filter(s=>s.status==="late"||s.status==="never");
  if(UI.filter==="soon") list=list.filter(s=>s.status==="soon");
  if(UI.filter==="alerts") list=list.filter(s=>s.alerts.length);
  list.sort((a,b)=>a.daysUntil-b.daysUntil);
  const head=`<div class="row"><h1>${isAdmin()?"Lojas":"As minhas lojas"}</h1><div class="inline">${isAdmin()?`<select id="supFilter" style="width:auto;min-width:160px"><option value="all">Todos os supervisores</option>${S.users.filter(u=>u.role==="sup").map(u=>`<option value="${u.id}" ${UI.supFilter==String(u.id)?"selected":""}>${esc(u.name)}</option>`).join("")}</select>`:""}
    <div class="seg" role="tablist">${[["lista","Lista"],["mapa","Mapa"],["rota","Rota"]].map(([k,l])=>`<button class="${UI.view===k?"on":""}" data-view="${k}" role="tab" aria-selected="${UI.view===k}">${l}</button>`).join("")}</div></div></div>`;
  if(UI.view==="mapa") return head+MapView(myStoresFiltered());
  if(UI.view==="rota") return head+RouteView(myStoresFiltered());
  return head+`<div class="chips" role="tablist">${[["all","Todas"],["late","🔴 Atrasadas"],["soon","🟠 Esta semana"],["alerts","⚠️ Alertas"]].map(([k,l])=>`<button class="chip ${UI.filter===k?"on":""}" data-filter="${k}" role="tab" aria-selected="${UI.filter===k}">${l} <b>${counts[k]}</b></button>`).join("")}</div>
  ${list.length? `<ul class="list">${list.map(s=>`<li><button class="card store-card" data-store="${s.id}"><div class="body">
      <div class="row"><span class="name">${esc(s.name)}</span>${statusChip(s)}</div>
      <div class="meta"><span>${esc(s.city)}</span><span>·</span><span>Cadência ${s.cadE}${s.tempCad&&s.cadE===s.tempCad?" (temp.)":""}</span><span>·</span><span>Última visita ${s.last?fmtDate(s.last):"—"}${s.lastReason?` · ${esc(s.lastReason)}`:""}</span>${isAdmin()?`<span>·</span><span>${esc(s.supName)}</span>`:""}</div>
      <div class="badges">${s.noVisit&&s.last?`<span class="badge late">⏱ Sem visita há ${s.noVisitDays} dias</span>`:""}${s.open?`<span class="badge ${s.late?"late":""}">${s.open} ação(ões)${s.late?` · ${s.late} em atraso`:""}</span>`:""}${s.alerts.filter(a=>!a.includes("ação")&&!a.startsWith("Sem visita")&&a!=="Nunca visitada").map(a=>`<span class="badge alert">⚠️ ${esc(a)}</span>`).join("")}</div>
    </div><span style="color:var(--muted)">›</span></button><div class="inline" style="margin-top:-6px;padding:0 4px 4px">${navBtn(s,"btn sm ghost")}</div></li>`).join("")}</ul>`
    : `<p class="muted" style="text-align:center;padding:32px 0">${UI.filter==="all"?"Nenhuma loja atribuída.":"Nada a assinalar. 👍"}</p>`}
  <p class="demo">Dados de exemplo · protótipo</p>`;
}
function myStoresFiltered(){ let l=myStores(); if(isAdmin()&&UI.supFilter!=="all") l=l.filter(s=>String(s.sup)===UI.supFilter); return l; }
function MapView(list){
  const sel = list.find(s=>s.id===UI.mapSel);
  const counts={late:list.filter(s=>s.status==="late"||s.status==="never").length,soon:list.filter(s=>s.status==="soon").length,ok:list.filter(s=>s.status==="ok").length};
  return `<section class="card" style="padding:8px"><div class="legend"><span><i style="background:var(--late)"></i>Atrasada / nunca ${counts.late}</span><span><i style="background:var(--soon)"></i>Esta semana ${counts.soon}</span><span><i style="background:var(--ok)"></i>Em dia ${counts.ok}</span></div>${MapSVG(list,null,UI.mapSel)}<p class="muted" style="text-align:center">Toque num ponto para ver a loja.</p></section>
  ${sel?`<div class="card"><div class="row"><span class="name">${esc(sel.name)}</span>${statusChip(sel)}</div><div class="meta"><span>${esc(sel.city)}</span><span>·</span><span>Última visita ${sel.last?fmtDate(sel.last):"—"}</span>${sel.lastReason?`<span>·</span><span>${esc(sel.lastReason)}</span>`:""}</div>${sel.alerts.length?`<div class="badges">${sel.alerts.map(a=>`<span class="badge alert">⚠️ ${esc(a)}</span>`).join("")}</div>`:""}<div class="inline">${navBtn(sel)}<button class="btn sm" data-store="${sel.id}">Ficha</button><button class="btn sm ghost" data-nova="${sel.id}">Nova visita</button></div></div>`:""}`;
}
function RouteView(list){
  if(UI.routeSel===null) UI.routeSel = list.filter(s=>s.status!=="ok"||s.noVisit).map(s=>s.id);
  const chosen = list.filter(s=>UI.routeSel.includes(s.id)&&s.lat!=null);
  const startOpts=[["first","Primeira loja da lista"],["me","A minha posição (GPS)"]].concat(list.filter(s=>s.lat!=null).map(s=>["s"+s.id,"Partir de "+s.name]));
  let start=null, order=[];
  if(chosen.length){
    if(UI.routeStart==="me"&&UI.myPos) start=UI.myPos;
    else if(UI.routeStart.startsWith("s")) start=list.find(s=>"s"+s.id===UI.routeStart)||chosen[0];
    else start=chosen[0];
    order=planRoute(start, chosen.filter(s=>s!==start));
    if(start===chosen[0]||chosen.includes(start)) order=[start,...order.filter(s=>s!==start)];
  }
  const legs=order.map((s,i)=>({s,d:i===0?(start&&start!==s?km(start,s):0):km(order[i-1],s)}));
  const totalKm=Math.round(legs.reduce((a,l)=>a+l.d,0));
  const sched=schedule(start&&!chosen.includes(start)?start:null,order,570);
  const minutes=Math.round(totalKm/70*60)+order.length*45;
  const gmaps=order.length?`https://www.google.com/maps/dir/${(UI.routeStart==="me"&&UI.myPos?[UI.myPos]:[]).concat(order).map(p=>`${p.lat},${p.lng}`).join("/")}`:"";
  const naive=chosen.length>1?routeKm(chosen[0],chosen.slice(1)):0;
  return `<section class="card"><div class="row"><h2>Planear o dia</h2><span class="muted">${chosen.length} loja(s)</span></div>
    <p class="muted">Pré-selecionadas: lojas atrasadas, a visitar esta semana ou sem visita há mais de ${S.settings.maxNoVisit} dias. Ajuste e a ordem é calculada pela distância (ótimo exato até 8 lojas).${chosen.length>1&&naive-totalKm>=2?` Pela ordem da lista seriam ≈ ${Math.round(naive)} km; a rota sugerida poupa ${Math.round(naive-totalKm)} km.`:""}</p>
    <div class="route-pick">${list.map(s=>`<label class="pick ${UI.routeSel.includes(s.id)?"on":""}"><input type="checkbox" data-route="${s.id}" ${UI.routeSel.includes(s.id)?"checked":""}><span class="status s-${s.status}" style="padding:2px 6px 2px 6px"></span><span style="flex:1;min-width:0"><b>${esc(s.name)}</b><br><small class="muted">${esc(s.city)} · ${esc(s.statusText)}${s.lat==null?" · sem coordenadas":""}</small></span></label>`).join("")}</div>
    <label class="field"><span>Ponto de partida</span><select id="routeStart">${startOpts.map(([v,l])=>`<option value="${v}" ${UI.routeStart===v?"selected":""}>${l}</option>`).join("")}</select></label>
    ${UI.routeStart==="me"&&!UI.myPos?`<button class="btn sm outline" data-act="mypos" style="align-self:flex-start">📍 Obter a minha posição</button>`:""}</section>
  ${order.length?`<section class="card"><div class="row"><h2>Rota sugerida</h2><span class="muted">≈ ${totalKm} km · ${Math.floor(minutes/60)}h${pad(minutes%60)} com ${order.length} visita(s) de 45 min</span></div>
    ${MapSVG(list,order,null)}
    <ol class="route-list">${legs.map((l,i)=>`<li><span class="n">${i+1}</span><span style="flex:1;min-width:0"><b>${esc(l.s.name)}</b> <small class="muted">${esc(l.s.city)}</small><br><small class="muted">${l.d?`${Math.round(l.d)} km · ${Math.round(l.d/DRIVE_KMH*60)} min · `:""}chegada ≈ ${hm(sched[i].arrive)} · ${esc(l.s.statusText)}${l.s.open?` · ${l.s.open} ação(ões)`:""}</small></span><a class="btn sm outline" href="${navUrl(l.s)}" target="_blank" rel="noreferrer" aria-label="Ir para ${esc(l.s.name)}">🧭</a><button class="btn sm ghost" data-store="${l.s.id}">Ficha</button></li>`).join("")}</ol>
    <div class="inline"><a class="btn" href="${gmaps}" target="_blank" rel="noreferrer">Abrir no Google Maps</a><input id="routeDate" type="date" value="${UI.agDate}" style="width:auto"><button class="btn outline" data-act="saveroute">Guardar na agenda</button></div><p class="muted">Distâncias estimadas (linha reta × 1,25). O Google Maps dá o trajeto real. «Guardar na agenda» cria as visitas planeadas do dia, pela ordem, de 45 em 45 min a partir das 9h30.</p></section>`:`<p class="muted" style="text-align:center">Escolha pelo menos uma loja com coordenadas.</p>`}`;
}

function Loja(){
  const s0 = S.stores.find(x=>x.id===UI.storeId); if(!s0) return `<p>Loja não encontrada.</p>`;
  const s = summary(s0);
  const vs = S.visits.filter(v=>v.store===s.id).sort((a,b)=>b.at.localeCompare(a.at));
  const acts = S.actions.filter(a=>a.store===s.id && a.status!=="done").sort((a,b)=>a.due.localeCompare(b.due));
  const st = S.stock.filter(x=>x.site===s.code);
  const rupt = st.filter(x=>x.qty<=0), dorm = st.filter(x=>x.qty>0 && (!x.last||daysBetween(x.last,today())>S.settings.dormant));
  const sh = S.shipments.filter(x=>x.site===s.code).sort((a,b)=>b.date.localeCompare(a.date));
  const k = S.kpis.filter(x=>x.site===s.code).sort((a,b)=>b.month.localeCompare(a.month))[0];
  const noShip = s.lastShip && daysBetween(s.lastShip,today())>S.settings.noShip;
  const visitBlock = v => { const bad=new Set(v.bad); return `<div style="display:flex;flex-direction:column;gap:6px">
    <div class="row muted"><span>${fmtDT(v.at)} · ${esc(S.users.find(u=>u.id===v.sup)?.name||"")}</span>${v.rating?`<span style="color:var(--soon)">${"★".repeat(v.rating)}${"☆".repeat(5-v.rating)}</span>`:""}</div>
    ${v.reason?`<span class="badge" style="align-self:flex-start">Motivo: ${esc(v.reason)}</span>`:""}
    <ul class="checklist-res">${S.items.filter(i=>i.active||bad.has(i.id)).map(i=>`<li class="${bad.has(i.id)?"late-t":""}">${bad.has(i.id)?"❌":"✅"} ${esc(i.label)}</li>`).join("")}</ul>
    ${!v.bad.length?`<p class="ok-t" style="margin:0">Todos os pontos conformes.</p>`:""}
    ${v.comment?`<p class="comment">${esc(v.comment)}</p>`:""}
    ${v.extra?`<div class="kv">${v.extra.managerPresent?`<span>Responsável presente</span><span>${esc(v.extra.managerPresent)}</span>`:""}${v.extra.staff?`<span>Colaboradores presentes</span><span>${v.extra.staff}</span>`:""}${v.extra.salesFeel?`<span>Vendas vs objetivo</span><span>${esc(v.extra.salesFeel)}</span>`:""}${v.extra.promoOk?`<span>Promoção em vigor</span><span>${esc(v.extra.promoOk)}</span>`:""}${v.extra.training&&v.extra.training.length?`<span>Formação a dar</span><span>${esc(v.extra.training.join(", "))}</span>`:""}${v.extra.competition?`<span>Concorrência</span><span>${esc(v.extra.competition)}</span>`:""}${v.extra.nextSteps?`<span>Próximos passos</span><span>${esc(v.extra.nextSteps)}</span>`:""}${v.extra.followUp?`<span>Follow-up</span><span>${fmtDate(v.extra.followUp)}</span>`:""}</div>`:""}
    ${v.photos.length?`<div class="photos">${v.photos.map(p=>`<span class="photo"><img src="${p}" alt=""></span>`).join("")}</div>`:""}
    ${v.lat!=null?`<a href="https://maps.google.com/?q=${v.lat},${v.lng}" target="_blank" rel="noreferrer" style="font-size:.85rem">📍 posição registada</a>`:""}
    <p class="muted">${v.sent?"Relatório enviado ao responsável":"Relatório não enviado"}</p></div>`; };
  return `<button class="link" data-go="lojas" style="align-self:flex-start;padding-left:0">← Lojas</button>
  <header style="display:flex;flex-direction:column;gap:8px"><h1 style="font-size:1.8rem">${esc(s.name)}</h1>
    <div class="meta" style="align-items:center">${statusChip(s)}<span>${esc(s.city)} · ${esc(s.code)}</span><span>Cadência ${s.cadE} · ${cadDays(s.cadE)} dias${s.tempCad&&s.cadE===s.tempCad?` (temporária até ${fmtDate(s.tempUntil)})`:""}</span></div>
    <div class="meta"><span>Responsável: <b>${esc(s.manager)}</b> · ${esc(s.email)}</span><span>Supervisor: ${esc(s.supName)}</span>${s.priority&&s.priority!=="Normal"?`<span class="badge ${s.priority==="Alta"?"late":""}">Prioridade ${esc(s.priority)}</span>`:""}</div>
    <div class="inline"><button class="btn lg" data-nova="${s.id}" style="flex:1">${I.plus} Nova visita</button><button class="btn outline" data-planstore="${s.id}">${I.cal} Planear</button></div>
    <div class="inline">${navBtn(s,"btn outline")}${wazeUrl(s)?`<a class="btn ghost" href="${wazeUrl(s)}" target="_blank" rel="noreferrer">Waze</a>`:""}${s.phone?`<a class="btn ghost" href="tel:${esc(s.phone.replace(/\s/g,""))}">📞 ${esc(s.phone)}</a>`:""}</div></header>
  ${(()=>{const nxt=S.planned.filter(p=>p.store===s.id&&!p.visitId&&p.date>=iso(today())).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0]; return nxt?`<section class="card plan"><div class="row"><span><span class="time">${fmtDay(nxt.date)} ${nxt.time}</span> · próxima visita planeada</span><button class="btn sm ghost" data-editplan="${nxt.id}">Editar</button></div><div class="muted">${esc(nxt.reason)}${nxt.notes?` · ${esc(nxt.notes)}`:""}</div></section>`:"";})()}
  <section class="card"><h2>Loja</h2><div class="kv"><span>Morada</span><span>${esc(s.address||"—")}</span><span>Telefone</span><span>${esc(s.phone||"—")}</span><span>Horário</span><span>${esc(s.hours||"—")}</span><span>Equipa</span><span>${s.team??"—"} colaborador(es)</span><span>Cadência</span><span>${s.cad}${s.tempCad?` · temporária ${s.tempCad} até ${fmtDate(s.tempUntil)}`:""}</span></div>
    <label class="field"><span>Notas da loja (visíveis por todos)</span><textarea data-storenotes="${s.id}" rows="2" placeholder="Ex.: equipa nova, obras no centro, horário especial…">${esc(s.notes||"")}</textarea></label></section>
  <section class="card ${s.alerts.length?"alert":""}"><h2>Alertas</h2>${s.alerts.length?`<ul style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px">${s.alerts.map(a=>`<li>⚠️ ${esc(a)}</li>`).join("")}</ul>`:`<p class="muted">Nada a assinalar.</p>`}</section>
  <section class="card"><div class="row"><h2>Ações abertas</h2><span class="badge">${acts.length}</span></div>
    ${acts.length?acts.map(a=>{const late=dayOf(a.due)<today();return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div style="min-width:0"><div style="font-weight:500">${esc(a.title)}</div><div class="muted">${esc(a.owner)} · <span class="${late?"late-t":""}">${late?"Atrasada · ":"prazo "}${fmtDate(a.due)}</span> · ${actLabel(a.status)}</div></div><button class="btn sm ${late?"":"outline"}" data-done="${a.id}">Feita ✓</button></div>`;}).join(""):`<p class="muted">Nenhuma ação aberta.</p>`}</section>
  <section class="card"><h2>Última visita</h2>${vs[0]?visitBlock(vs[0]):`<p class="muted">Ainda sem visitas.</p>`}
    ${vs.length>1?`<details><summary>Visitas anteriores (${vs.length-1})</summary><div style="display:flex;flex-direction:column;gap:16px;margin-top:8px">${vs.slice(1).map(visitBlock).join("<hr style='border:0;border-top:1px solid var(--line)'>")}</div></details>`:""}</section>

function submitVisit(){
  const d=UI.draft; const store=S.stores.find(x=>x.id===+d.store); if(!store) return;
  const ex={...d.extra, staff:d.extra.staff===""?"":+d.extra.staff};
  const v={id:nextId(S.visits),store:store.id,sup:UI.user,at:d.at,reason:d.reason,rating:d.rating,comment:d.comment.trim(),bad:[...d.bad],photos:d.photos,lat:d.geo?.lat??null,lng:d.geo?.lng??null,sent:true,extra:ex};
  S.visits.push(v);
  if(ex.priority) store.priority=ex.priority;
  const pl = d.planId? S.planned.find(p=>p.id===d.planId) : S.planned.find(p=>p.store===store.id&&!p.visitId&&p.date===d.at.slice(0,10));
  if(pl) pl.visitId=v.id;
  if(ex.followUp){ S.planned.push({id:nextId(S.planned),store:store.id,sup:UI.user,date:ex.followUp,time:"10:00",reason:"Acompanhamento de ações",notes:ex.nextSteps||"Follow-up da visita de "+fmtDate(d.at),visitId:null}); }
  const created=[];
  for(const id of d.bad){ const it=S.items.find(i=>i.id===id); if(!it) continue;
    const a={id:nextId(S.actions),store:store.id,visit:v.id,item:it.id,title:`${it.label} – ${store.name}`,owner:it.owner,status:"open",due:iso(addDays(new Date(d.at),it.days)),notes:it.action};
    S.actions.push(a); created.push(a); }
  const lines=S.items.filter(i=>i.active).map(i=>`${d.bad.includes(i.id)?"❌":"✅"} ${i.label}`).join("\n");
  const extraTxt=[ex.managerPresent&&`Responsável presente: ${ex.managerPresent}`, ex.staff!==""&&`Colaboradores presentes: ${ex.staff}`, ex.salesFeel&&`Vendas vs objetivo: ${ex.salesFeel}`, ex.promoOk&&`Promoção em vigor: ${ex.promoOk}`, ex.training.length&&`Formação a dar: ${ex.training.join(", ")}`, ex.competition&&`Concorrência: ${ex.competition}`, ex.nextSteps&&`Próximos passos: ${ex.nextSteps}`, ex.followUp&&`Follow-up planeado: ${fmtDate(ex.followUp)}`].filter(Boolean).join("\n");
  const body=`Relatório de visita — ${store.name}\n${fmtDT(d.at)} · Supervisor: ${user().name}\nMotivo: ${v.reason}\n${v.rating?`Avaliação global: ${"★".repeat(v.rating)}${"☆".repeat(5-v.rating)}\n`:""}\nChecklist\n${lines}\n\n${created.length?`Ações a realizar\n${created.map(a=>`• ${a.title} — prazo ${fmtDate(a.due)} · ${a.owner}\n  ${a.notes}`).join("\n")}`:"✅ Todos os pontos estão conformes. Obrigado!"}${v.comment?`\n\nComentário: ${v.comment}`:""}${extraTxt?`\n\n${extraTxt}`:""}${v.photos.length?`\n\n${v.photos.length} foto(s) em anexo`:""}`;
  S.outbox.unshift({at:new Date().toISOString(),to:`${store.email} (cc ${user().email})`,subject:`Relatório de visita — ${store.name}`,body});
  UI.draft=null;
  toast(`Visita registada · ${created.length} ação(ões) criada(s) · relatório enviado (simulado)`);
  go("loja",store.id);
}

const WD=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"], MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function AgendaDay(){
  const date=UI.agDate; const d=dayOf(date); const t=today(); const isToday=date===iso(t);

  const best=order.length>1?planRoute(order[0],order.slice(1)):[]; const bestOrder=order.length>1?[order[0],...best]:order; const bestKm=order.length>1?routeKm(order[0],best):0;
  const saving=Math.round(curKm-bestKm);
  const firstMin=pending.length?(+pending[0].time.slice(0,2))*60+(+pending[0].time.slice(3,5)):570;
  const sched=schedule(null,order,firstMin);

  const gmaps=order.length>1?`https://www.google.com/maps/dir/${order.map(s=>`${s.lat},${s.lng}`).join("/")}`:"";

    ${saving>=2?`<div class="hint">⚡ Há uma ordem mais curta: <b>≈ ${Math.round(bestKm)} km</b> (poupa ${saving} km) — ${bestOrder.map(s=>s.name.replace("P&C ","")).join(" → ")} <button class="btn sm" data-act="applybest">Aplicar e reordenar horas</button></div>`:order.length>1?`<p class="muted" style="padding:0 8px">✓ A ordem atual já é a mais curta.</p>`:""}
    <div class="inline" style="padding:0 8px 4px">${gmaps?`<a class="btn sm outline" href="${gmaps}" target="_blank" rel="noreferrer">Abrir o dia no Google Maps</a>`:""}<button class="btn sm ghost" data-act="mypos">📍 ${UI.myPos?"Posição obtida":"Partir da minha posição"}</button></div></section>`:""}

        <div class="card plan ${done?"done":""}"><div class="row"><span class="name" style="font-size:1.05rem;flex:1;min-width:0">${esc(s.name)}</span>${statusChip(s)}</div>

function AgendaWeek(){
  const base=dayOf(UI.agDate); const mon=addDays(base,-((base.getDay()+6)%7)); const t=today();
  const days=[...Array(7)].map((_,i)=>addDays(mon,i));

// ---------- CSV import ----------
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
function parseCSV(text){ const lines=text.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim()); if(!lines.length) return []; const sep=[";",",","\t","|"].sort((a,b)=>lines[0].split(b).length-lines[0].split(a).length)[0]; const head=lines[0].split(sep).map(h=>h.trim()); return lines.slice(1).map(l=>{const c=l.split(sep);const o={};head.forEach((h,i)=>o[h]=(c[i]||"").trim());return o;}); }
const pick=(r,...names)=>{const ks=Object.keys(r);for(const n of names){const k=ks.find(x=>norm(x)===norm(n));if(k!==undefined)return r[k];}return "";};
const toDate=raw=>{const s=(raw||"").trim();let m;if(!s)return null;if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return `${m[1]}-${m[2]}-${m[3]||"01"}`;if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/)))return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;return null;};
const toNum=raw=>{const n=parseFloat(String(raw).replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0;};
const toBool=raw=>["o","oui","s","sim","y","yes","1","true","x"].includes(String(raw).trim().toLowerCase());
const toStatus=raw=>{const n=norm(raw);return n.startsWith("rece")||n.startsWith("recu")||n==="r"?"received":n.startsWith("dif")||n.startsWith("ecart")||n==="d"?"discrepancy":"in_transit";};
function importCSV(kind,text){
  const rows=parseCSV(text); const known=new Set(S.stores.map(s=>s.code.toUpperCase())); const unknown=new Set(); let out=[];
  if(kind==="stock"){ out=rows.map(r=>({site:pick(r,"Site").toUpperCase(),ref:pick(r,"Referencia","Reference","Ref"),des:pick(r,"Designacao","Designation"),qty:Math.round(toNum(pick(r,"QtdStock","Qty","Stock"))),last:toDate(pick(r,"DataUltimaVenda","LastSale")),top:toBool(pick(r,"TopVenda","Top"))})).filter(x=>x.site&&x.ref); if(!out.length) return toast("Nenhuma linha reconhecida: verifique os cabeçalhos."); S.stock=out; }
  else if(kind==="shipments"){ out=rows.map(r=>({no:pick(r,"NumExpedicao","Expedicao","Shipment"),site:pick(r,"SiteDestino","Site").toUpperCase(),date:toDate(pick(r,"DataEnvio","SentDate")),lines:Math.round(toNum(pick(r,"NbLinhas","Lines"))),sent:Math.round(toNum(pick(r,"QtdEnviada","QtySent"))),recv:Math.round(toNum(pick(r,"QtdRecebida","QtyReceived"))),status:toStatus(pick(r,"Estado","Statut","Status"))})).filter(x=>x.no&&x.site); if(!out.length) return toast("Nenhuma linha reconhecida: verifique os cabeçalhos."); S.shipments=out; }
  else { out=rows.map(r=>({site:pick(r,"Site").toUpperCase(),month:(toDate(pick(r,"Mes","Mois","Month"))||"").slice(0,7),sales:toNum(pick(r,"Vendas","Sales")),target:toNum(pick(r,"Objetivo","Target")),traffic:Math.round(toNum(pick(r,"Trafego","Traffic"))),tickets:Math.round(toNum(pick(r,"Tickets")))})).filter(x=>x.site&&x.month); if(!out.length) return toast("Nenhuma linha reconhecida: verifique os cabeçalhos."); out.forEach(k=>{const i=S.kpis.findIndex(x=>x.site===k.site&&x.month===k.month); if(i>=0)S.kpis[i]=k; else S.kpis.push(k);}); }
  out.forEach(x=>{ if(!known.has(x.site)) unknown.add(x.site); });
  S.imports.unshift({kind:kind==="stock"?"Stock":kind==="shipments"?"Expedições":"KPI",at:new Date().toISOString(),rows:out.length,unknown:[...unknown].sort()});
  toast(`${out.length} linha(s) importada(s)${unknown.size?` · sites sem loja: ${[...unknown].join(", ")}`:""}`); UI.sedeTab="painel"; render();
}

function bind(){
  root.onclick = e => {
    const b = e.target.closest("[data-login],[data-act],[data-go],[data-store],[data-filter],[data-nova],[data-done],[data-prog],[data-reopen],[data-toggle],[data-star],[data-rmphoto],[data-acttab],[data-sedetab],[data-agenda],[data-view],[data-mapstore],[data-agview],[data-agshift],[data-agtoday],[data-agday],[data-newplan],[data-planstore],[data-editplan],[data-startvisit],[data-q],[data-train]");
    if(!b) return;
    const d=b.dataset;
    if(d.view){ UI.view=d.view; if(d.view==="rota") UI.routeSel=null; render(); return; }
    if(d.agview){ UI.agView=d.agview; render(); return; }
    if(d.agshift){ const n=+d.agshift; const dd=dayOf(UI.agDate); if(Math.abs(n)===30){ dd.setMonth(dd.getMonth()+Math.sign(n)); } else dd.setDate(dd.getDate()+n); UI.agDate=iso(dd); render(); return; }
    if(d.agtoday){ UI.agDate=TODAY; render(); return; }
    if(d.agday){ UI.agDate=d.agday; UI.agView="hoje"; render(); return; }
    if(d.newplan){ openPlan(d.newplan,null,null); return; }
    if(d.planstore){ openPlan(TODAY,null,+d.planstore); return; }
    if(d.editplan){ openPlan(null,+d.editplan,null); return; }
    if(d.startvisit){ const p=S.planned.find(x=>x.id===+d.startvisit); if(!p) return; UI.storeId=p.store; UI.draft=null; go("nova"); UI.draft.planId=p.id; UI.draft.reason=p.reason; render(); return; }
    if(d.q){ UI.draft.extra[d.q] = UI.draft.extra[d.q]===d.v? "" : d.v; render(); return; }
    if(d.train){ const arr=UI.draft.extra.training; const i=arr.indexOf(d.train); i>=0?arr.splice(i,1):arr.push(d.train); render(); return; }
    if(d.act==="more"){ UI.more=!UI.more; render(); return; }
    if(d.act==="saveplan"){ const p=UI.plan; if(!p.store) return; if(UI.planId){ const x=S.planned.find(y=>y.id===UI.planId); Object.assign(x,{store:+p.store,date:p.date,time:p.time,reason:p.reason,notes:p.notes}); } else { const st=S.stores.find(x=>x.id===+p.store); S.planned.push({id:nextId(S.planned),store:+p.store,sup:st.sup||UI.user,date:p.date,time:p.time,reason:p.reason,notes:p.notes,visitId:null}); } UI.agDate=p.date; UI.agView="hoje"; toast("Visita guardada na agenda"); go("agenda"); return; }
    if(d.act==="delplan"){ S.planned=S.planned.filter(x=>x.id!==UI.planId); toast("Visita planeada apagada"); go("agenda"); return; }
    if(d.act==="saveroute"){ const date=$("#routeDate")?.value||TODAY; const list=myStoresFiltered(); const chosen=list.filter(s=>UI.routeSel.includes(s.id)&&s.lat!=null); if(!chosen.length) return; let start=chosen[0]; if(UI.routeStart==="me"&&UI.myPos) start=UI.myPos; else if(UI.routeStart.startsWith("s")) start=list.find(s=>"s"+s.id===UI.routeStart)||chosen[0]; let order=planRoute(start,chosen.filter(s=>s!==start)); if(chosen.includes(start)) order=[start,...order.filter(s=>s!==start)]; let min=9*60+30; order.forEach(s=>{ if(!S.planned.some(p=>p.store===s.id&&p.date===date&&!p.visitId)) S.planned.push({id:nextId(S.planned),store:s.id,sup:s.sup,date,time:`${pad(Math.floor(min/60))}:${pad(min%60)}`,reason:s.noVisit||s.status!=="ok"?"Visita de cadência":"Acompanhamento de ações",notes:s.alerts.slice(0,2).join(" · "),visitId:null}); min+=45+Math.round((order.indexOf(s)<order.length-1?km(s,order[order.indexOf(s)+1]):0)/70*60); }); UI.agDate=date; UI.agView="hoje"; toast(`${order.length} visita(s) guardada(s) na agenda de ${fmtDay(date)}`); go("agenda"); return; }
    if(d.mapstore){ UI.mapSel = UI.mapSel===+d.mapstore? null : +d.mapstore; render(); return; }
    if(d.act==="mypos"){ if(!navigator.geolocation){toast("GPS indisponível");return;} navigator.geolocation.getCurrentPosition(p=>{UI.myPos={lat:p.coords.latitude,lng:p.coords.longitude,name:"A minha posição"};render();},()=>toast("Posição recusada ou indisponível"),{enableHighAccuracy:true,timeout:10000}); return; }
    if(d.act==="applybest"){ const pend=myPlanned().filter(p=>p.date===UI.agDate&&!p.visitId).sort((a,b)=>a.time.localeCompare(b.time)); const st=pend.map(p=>summary(S.stores.find(x=>x.id===p.store))).filter(s=>s.lat!=null); if(st.length<2) return; const first=st[0]; const best=[first,...planRoute(first,st.slice(1))]; let min=(+pend[0].time.slice(0,2))*60+(+pend[0].time.slice(3,5)); const rows=schedule(null,best,min); rows.forEach(r=>{ const p=pend.find(x=>x.store===r.s.id); if(p) p.time=hm(r.arrive); }); toast("Ordem mais curta aplicada · horas recalculadas"); render(); return; }
    if(d.login){ UI.user=+d.login; UI.screen="lojas"; render(); return; }
    if(d.go){ go(d.go); return; }
    if(d.store){ go("loja",+d.store); return; }
    if(d.nova){ UI.storeId=+d.nova; UI.draft=null; go("nova"); return; }
    if(d.filter){ UI.filter=d.filter; render(); return; }
    if(d.acttab){ UI.actTab=d.acttab; render(); return; }
    if(d.sedetab){ UI.sedeTab=d.sedetab; render(); return; }
    if(d.agenda){ agenda(+d.agenda); return; }
    if(d.done||d.prog||d.reopen){ const a=S.actions.find(x=>x.id===+(d.done||d.prog||d.reopen)); if(a){ a.status=d.done?"done":d.prog?"in_progress":"open"; toast(d.done?"Ação fechada":d.prog?"Ação em curso":"Ação reaberta"); render(); } return; }
    if(d.toggle){ const id=+d.toggle, i=UI.draft.bad.indexOf(id); i>=0?UI.draft.bad.splice(i,1):UI.draft.bad.push(id); render(); return; }
    if(d.star){ UI.draft.rating = UI.draft.rating===+d.star? null : +d.star; render(); return; }
    if(d.rmphoto){ UI.draft.photos.splice(+d.rmphoto,1); render(); return; }
    if(d.act==="logout"){ UI.user=null; UI.draft=null; render(); return; }
    if(d.act==="reset"){ S=SEED(); save(); toast("Dados de exemplo repostos"); render(); return; }
    if(d.act==="addphoto"){ $("#f-photo").click(); return; }
    if(d.act==="geo"){ UI.draft.geoState="asking"; render(); if(!navigator.geolocation){UI.draft.geoState="denied";render();return;} navigator.geolocation.getCurrentPosition(p=>{UI.draft.geo={lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)};UI.draft.geoState="idle";render();},()=>{UI.draft.geoState="denied";render();},{enableHighAccuracy:true,timeout:10000}); return; }
    if(d.act==="submit"){ submitVisit(); return; }
    if(d.act==="addstore"){ const id=nextId(S.stores); S.stores.push({id,name:`Nova loja ${id}`,code:`L${String(100+id)}`,city:"",manager:"",email:"",cad:"B",tempCad:null,tempUntil:null,sup:S.users.find(u=>u.role==="sup").id,active:true}); render(); toast("Loja criada · edite o nome e o código Sage na app real"); return; }
    if(d.act==="additem"){ S.items.push({id:nextId(S.items),label:"Novo ponto",action:"",days:7,owner:"Responsável loja",active:true}); render(); return; }
  };
  root.onchange = e => {
    const t=e.target;
    if(t.id==="supFilter"){ UI.supFilter=t.value; render(); return; }
    if(t.id==="f-store"){ UI.draft.store=t.value; UI.storeId=+t.value||null; render(); return; }
    if(t.id==="f-at"){ UI.draft.at=t.value; return; }
    if(t.id==="f-reason"){ UI.draft.reason=t.value; return; }
    if(t.id==="f-staff"){ UI.draft.extra.staff=t.value; return; }
    if(t.id==="f-follow"){ UI.draft.extra.followUp=t.value; return; }
    if(t.id==="p-store"){ UI.plan.store=t.value; render(); return; }
    if(t.id==="p-date"){ UI.plan.date=t.value; return; }
    if(t.id==="p-time"){ UI.plan.time=t.value; return; }
    if(t.id==="p-reason"){ UI.plan.reason=t.value; return; }
    if(t.dataset.storenotes){ const s=S.stores.find(x=>x.id===+t.dataset.storenotes); if(s){ s.notes=t.value; save(); toast("Notas guardadas"); } return; }
    if(t.id==="routeStart"){ UI.routeStart=t.value; render(); return; }
    if(t.dataset.route){ const id=+t.dataset.route; const i=UI.routeSel.indexOf(id); i>=0?UI.routeSel.splice(i,1):UI.routeSel.push(id); render(); return; }
    if(t.id==="f-photo"){ Array.from(t.files||[]).forEach(f=>{ if(!f.type.startsWith("image/")) return; const img=new Image(); const url=URL.createObjectURL(f); img.onload=()=>{ const c=document.createElement("canvas"); const k=Math.min(1,900/Math.max(img.width,img.height)); c.width=img.width*k; c.height=img.height*k; c.getContext("2d").drawImage(img,0,0,c.width,c.height); UI.draft.photos.push(c.toDataURL("image/jpeg",.8)); URL.revokeObjectURL(url); render(); }; img.src=url; }); t.value=""; return; }
    if(t.dataset.import){ const f=t.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importCSV(t.dataset.import,String(r.result)); r.readAsText(f,"utf-8"); t.value=""; return; }
    if(t.dataset.cfg){ const [k,id]=t.dataset.cfg.split(":"); const v=t.type==="checkbox"?t.checked:t.value;
      if(k==="set"){ S.settings[id]=Math.max(1,+v||1); }
      else if(["sup","cad","tempCad","tempUntil","active","lat","lng"].includes(k)){ const s=S.stores.find(x=>x.id===+id); if(s){ if(k==="sup")s.sup=+v; else if(k==="tempCad")s.tempCad=v||null; else if(k==="tempUntil")s.tempUntil=v||null; else if(k==="lat"||k==="lng")s[k]=v===""?null:+v; else s[k]=v; } }
      else { const i=S.items.find(x=>x.id===+id); if(i){ if(k==="days")i.days=Math.max(0,+v||0); else if(k==="iactive")i.active=v; else i[k]=v; } }
      save(); toast("Guardado"); return; }
  };
  root.oninput = e => { const t=e.target; if(t.id==="f-comment") UI.draft.comment=t.value; else if(t.id==="f-comp") UI.draft.extra.competition=t.value; else if(t.id==="f-next") UI.draft.extra.nextSteps=t.value; else if(t.id==="p-notes") UI.plan.notes=t.value; };
}
render();
})();
</script>
